function releases(){let a=app();return head('設定とリリース','下書きを比較し、評価の証跡を関連付け、リリース後にインスタンスの実効設定を照合します。',badge(effective(a)?'反映済み':'一部反映',effective(a)?'good':'warn'))+context()+`<div class="toolbar"><select aria-label="ボットを選択" onchange="appId=this.value;render()">${state().apps.map(x=>`<option value="${x.id}" ${x.id===appId?'selected':''}>${x.name}</option>`).join('')}</select><span class="chip">目標リリース ${a.release}</span><span class="chip">下書き d${a.revision}</span></div>`+tabs([['prompt','プロンプト'],['parameters','モデルと検索'],['versions','リリース履歴'],['detection','検知サービス']],'configTab',configTab)+(configTab==='prompt'?`<div class="detail">${panel('プロンプトの下書き',`<div class="pad"><div class="meta">設定の保存先：バージョン管理されたリポジトリ（例） · プラットフォームのテンプレートは初期値のみ</div><textarea id="draft" aria-label="プロンプトの下書き" ${has('edit')?'':'readonly'} oninput="editPrompt(this.value)">${esc(a.draft)}</textarea><div class="row"><span class="sub" id="draftstate">${a.draft===a.prompt?'現在のリリースと一致':'下書きに未リリースの変更があります'}</span><div>${btn('下書きを保存','saveDraft()','','edit')} ${btn('承認してリリース','publishReview()','primary','publish')}</div></div></div>`)}<div>${evidencePanel(a)}${panel('インスタンスの実効設定',`<div class="pad">${a.effective.map((v,i)=>`<div class="row"><span>インスタンス ${i+1}</span>${badge(v,v===a.release?'good':'warn')}</div>`).join('')}<p class="sub">実行環境からのバージョン報告 · 現在のセッションの例</p>${!effective(a)?btn('再読み込み完了を模擬','reconcile()','','operate'):''}</div>`)}</div></div>`:configTab==='parameters'?`<div class="detail">${panel('管理対象のモデル・検索パラメータ',`<div class="pad formgrid"><div><label>モデル</label><select id="model" ${has('edit')?'':'disabled'}><option ${a.model===MODEL_A?'selected':''}>${MODEL_A}</option><option ${a.model===MODEL_B?'selected':''}>${MODEL_B}</option></select></div><div><label>提供元（参照のみ）</label><input readonly value="${a.provider}"></div><div><label>Temperature（0〜2）</label><input id="temperature" type="number" min="0" max="2" step="0.1" value="${a.temperature}" ${has('edit')?'':'disabled'}></div><div><label>FAQ 採用しきい値（0〜1）</label><input id="threshold" type="number" min="0" max="1" step="0.05" value="${a.threshold}" ${has('edit')?'':'disabled'}></div><div><label>取得件数（1〜100）</label><input id="recall" type="number" min="1" max="100" value="${a.recall}" ${has('edit')?'':'disabled'}></div><div><label>FAQ 質問文検索</label><select id="faqRecall" ${has('edit')?'':'disabled'}><option value="on" ${a.faqRecall?'selected':''}>有効（FAQ 質問文のベクトル検索）</option><option value="off" ${a.faqRecall?'':'selected'}>無効（完全一致のみ）</option></select></div><div><label>ナレッジのインデックス参照</label><select id="knowledgeVersion" ${has('edit')?'':'disabled'}>${availableIndexes(a).map(v=>`<option ${v===a.knowledgeVersion?'selected':''}>${v}</option>`).join('')}</select></div><div>${btn('パラメータの下書きを保存','saveParameters()','primary','edit')}</div></div>`)}<div>${evidencePanel(a)}${panel('モデルバージョンについて',`<div class="pad"><p class="sub">実際の提供元とモデルバージョンは実行時に記録します。表示名は不変のバージョンを意味しません。この例では Bedrock の採用を前提とせず、提供元をまたぐ自動的な切り替えも行いません。</p></div>`)}</div></div>`:configTab==='versions'?panel('リリースパッケージの履歴',table(['リリース','設定の参照','リリース者／日時','理由',''],a.history.map(h=>[`${h.release} ${h.release===a.release?badge('現在の目標'):''}`,`${h.model}<div class="sub">${h.knowledgeVersion}</div>`,`${h.who}<div class="sub">${h.time}</div>`,esc(h.reason),link('内容とロールバック',`historyDetail('${h.release}')`)]))):detectionPanels())}
function detectionPanels(){let p=state().pii;return `<div class="grid"><div>${panel('モデル・規則のバージョン',table(['項目','現在の値'],[['検知モデル',esc(p.modelVersion)],['規則セット',esc(p.ruleVersion)],['稼働場所','ローカルの検知サービス（クラウドへ切り替えない）'],['更新の条件','回帰検証の記録を伴う承認済みの手順']])+`<div class="pad">${btn('モデルバージョンを更新（回帰検証の記録付き）','updatePiiModel()','primary','publish')}</div>`,badge('個人情報の検知・マスキング','blue'))}${panel('回帰検証の記録',table(['バージョン','検証セット','結果','実施者／日時'],p.regressions.map(r=>[esc(r.version),esc(r.set),esc(r.result),`${esc(r.who)}<div class="sub">${r.time}</div>`])))}</div><div>${panel('許可リスト（職員ドメイン・機関名）',table(['種別','値',''],p.allow.map((x,i)=>[esc(x.kind),esc(x.value),btn('削除',`removeAllow(${i})`,'','edit')]))+`<div class="pad">${btn('許可リストに追加','newAllow()','','edit')}</div><p class="sub">許可リストに載る語は個人情報として検知・マスキングしません。変更は理由を必須とし、運用操作記録に残します。</p>`,badge(p.allow.length+' 件','blue'))}</div></div>`}
function newAllow(){if(!has('edit'))return;modal('許可リストに追加',`<div class="formgrid"><div><label>種別</label><select id="allowKind"><option>職員ドメイン</option><option>機関名</option></select></div><div><label>値（必須）</label><input id="allowValue" placeholder="例：example.go.jp"></div></div><p class="sub">追加後は次回の検知から適用されます。回帰検証の対象に含めてください。</p>`,btn('キャンセル','closeModal()')+btn('承認して追加','saveAllow()','primary'))}
function saveAllow(){let k=$('#allowKind').value,v=$('#allowValue').value.trim();if(!v)return toast('値を入力してください');review('許可リストへの追加','個人情報検知サービス',`${k}：${v}`,'edit',()=>state().pii.allow.push({kind:k,value:v}))}
function removeAllow(i){let x=state().pii.allow[i];review('許可リストからの削除','個人情報検知サービス',`${x.kind}：${x.value}`,'edit',()=>state().pii.allow.splice(i,1))}
function updatePiiModel(){let p=state().pii,next='pii-ja-v1.3';if(p.modelVersion===next)return toast('候補バージョンはすでに適用されています');review('検知モデルのバージョン更新','個人情報検知サービス',`${p.modelVersion} → ${next}；回帰セット 120 件の結果を記録してから切り替えます。クラウドへの切り替えは行いません。`,'publish',reason=>{p.regressions.unshift({version:next,set:'回帰セット 120 件',result:'合格（模擬）',who:$('#role').selectedOptions[0].text,time:stamp()});p.modelVersion=next})}
function saveDraft(){if(!has('edit'))return;if(!app().draft.trim())return toast('プロンプトは空にできません');log('下書き保存',app().name,'下書き d'+app().revision+'；リリース済みの設定は変更していません');toast('下書きの保存を記録しました（模擬）')}
function availableIndexes(a){let k=state().knowledge.find(k=>k.name===a.knowledge);return [...new Set([a.knowledgeVersion,k.version])]}
function evidencePanel(a){return panel('評価とリリース証跡',`<div class="pad"><div class="row"><span>評価の実施</span><b>精度検証プラットフォーム</b></div><div class="row"><span>結果の関連付け</span>${badge(verified(a)?'現在の下書きは検証済み':'下書きは未検証',verified(a)?'good':'warn')}</div><div class="sub">${a.eval.id} · ${a.eval.status} · 下書き d${a.eval.revision}</div><p class="sub">評価と本番は同じ設定内容のハッシュ値／バージョンで関連付けます。このデモは評価結果の取り込みだけを模擬し、モデルの評価は実行しません。</p>${btn('合格結果の取り込みを模擬','evaluateDraft()','','evaluate')}</div>`)}
function editPrompt(v){if(!has('edit'))return;let a=app();a.draft=v;a.revision++;$('#draftstate').textContent='下書きに未リリースの変更があります。評価の再関連付けが必要です';}
function saveParameters(){if(!has('edit'))return;let t=+$('#temperature').value,f=+$('#threshold').value,r=+$('#recall').value;if(!Number.isFinite(t)||t<0||t>2||!Number.isFinite(f)||f<0||f>1||!Number.isInteger(r)||r<1||r>100)return toast('パラメータの範囲と取得件数を確認してください');let a=app();Object.assign(a,{model:$('#model').value,temperature:t,threshold:f,recall:r,faqRecall:$('#faqRecall').value==='on',knowledgeVersion:$('#knowledgeVersion').value,revision:a.revision+1});log('下書き保存',a.name,'モデル・検索パラメータを更新；稼働中の設定は変更していません');render();toast('パラメータの下書きを保存しました。リリース前に再検証が必要です')}
function evaluateDraft(){if(!has('evaluate'))return;let a=app();if(!a.draft.trim())return toast('プロンプトは空にできません');a.eval={revision:a.revision,digest:a.draft,signature:digest(a),status:'合格',id:'eval-'+Date.now().toString().slice(-6)};log('評価結果の取り込み',a.name,`${a.eval.id}；現在の下書きのハッシュ値と一致；模擬の合格`);render();toast('模擬の合格結果を関連付けました。実際の評価は実行していません')}
function diffPrompt(before,after){let left=before.split('\n'),right=after.split('\n');return `<div class="diff-list">${Array.from({length:Math.max(left.length,right.length)},(_,i)=>left[i]===right[i]?`<div class="same"><span>${i+1}</span> ${esc(left[i]||'')}</div>`:`${left[i]!==undefined?`<div class="removed"><span>−</span> ${esc(left[i])}</div>`:''}${right[i]!==undefined?`<div class="added"><span>+</span> ${esc(right[i])}</div>`:''}`).join('')}</div>`}
function publishReview(){if(!has('publish'))return;let a=app(),base=a.history.find(h=>h.release===a.release);if(!a.draft.trim())return toast('プロンプトは空にできません');if(a.draft===base.prompt&&a.model===base.model&&a.temperature===base.temperature&&a.threshold===base.threshold&&a.recall===base.recall&&a.faqRecall===base.faqRecall&&a.knowledgeVersion===base.knowledgeVersion)return toast('リリース待ちの変更はありません');let revision=a.revision;modal(askTitle('リリースパッケージの承認'),`<div class="target-line">${a.name} · ${env()} · ${a.release} → 新規リリース</div>${diffPrompt(a.prompt,a.draft)}<div class="pad">${table(['項目','現在のリリース','リリース予定'],[['モデル',base.model,a.model],['Temperature',base.temperature,a.temperature],['FAQ 採用しきい値',base.threshold,a.threshold],['取得件数',base.recall,a.recall],['FAQ 質問文検索',base.faqRecall?'有効':'無効',a.faqRecall?'有効':'無効'],['ナレッジのインデックス',base.knowledgeVersion,a.knowledgeVersion]])}</div><div class="notice"><div><b>${verified(a)?'評価のハッシュ値が一致':'現在の下書きに一致する評価の証跡がありません'}</b><div class="sub">${verified(a)?a.eval.id:'いったん閉じて評価結果の取り込みを模擬したうえで、再度承認してください。'}</div></div></div><label class="field">リリース理由（必須）</label><textarea id="reason" aria-label="リリース理由"></textarea>`,btn('キャンセル','closeModal()')+`<button class="btn primary" id="publishConfirm" ${verified(a)?'':'disabled'}>リリースを確定（模擬）</button>`);focusCancel();$('#publishConfirm').onclick=()=>{if(a.revision!==revision){log('設定リリース',a.name,'承認後に下書きが変更されたため、リリースを拒否','失敗');closeModal();render();return toast('下書きが変更されました。再度承認してください')}let r=$('#reason').value.trim();if(!r)return toast('リリース理由を記入してください');commitRelease(a,r,'設定リリース')};}
function commitRelease(a,reason,action){if(!has('publish'))return;a.release='r'+(Math.max(...a.history.map(h=>+h.release.slice(1)))+1);a.prompt=a.draft;let h={release:a.release,prompt:a.prompt,model:a.model,temperature:a.temperature,threshold:a.threshold,recall:a.recall,faqRecall:a.faqRecall,knowledgeVersion:a.knowledgeVersion,reason,who:$('#role').selectedOptions[0].text,time:stamp()};a.history.unshift(h);a.effective[0]=a.release;log(action,a.name,`${a.release}；評価 ${a.eval.id}；理由：${reason}；インスタンス 1/2 が再読み込み済み`);closeModal();render();toast('リリースを確定しました。インスタンスへの反映は一部のみです（模擬）')}
function reconcile(){review('インスタンスの実効設定を照合',app().name,'残りのインスタンスが再読み込みを完了し、目標バージョンを報告する状態を模擬します。','operate',()=>{app().effective=[app().release,app().release]})}
function historyDetail(id){let a=app(),h=a.history.find(h=>h.release===id);modal('リリースパッケージ '+id,`<div class="diff">${esc(h.prompt)}</div>${table(['参照','バージョン'],[['モデル',h.model],['ナレッジのインデックス',h.knowledgeVersion],['検索パラメータ',`FAQ 採用しきい値 ${h.threshold} / 取得件数 ${h.recall} / FAQ 質問文検索 ${h.faqRecall===false?'無効':'有効'}`]])}<p class="sub">${esc(h.reason)} · ${h.time}</p><p class="sub">ロールバックは過去の設定をロールバック用の下書きとして復元します。再評価と再リリースが必要で、元の履歴は保持します。</p>`,btn('閉じる','closeModal()')+(id!==a.release?btn('ロールバック用の下書きとして復元',`rollbackDraft('${id}')`,'primary','publish'):''))}
function rollbackDraft(id){review('ロールバック用の下書きの準備',app().name,id+' の設定参照を復元します。稼働中のバージョンは直接置き換えません。','publish',()=>{let a=app(),h=a.history.find(h=>h.release===id);Object.assign(a,{draft:h.prompt,model:h.model,temperature:h.temperature,threshold:h.threshold,recall:h.recall,faqRecall:h.faqRecall!==false,knowledgeVersion:h.knowledgeVersion,revision:a.revision+1});configTab='prompt'})}
function piiMetrics(){let p=state().pii;return panel('個人情報検知サービスの指標',`<div class="pad"><div class="metricline"><div class="stat"><span class="sub">稼働率（30 日）</span><strong>${p.uptime}</strong></div><div class="stat"><span class="sub">p95 応答</span><strong>${p.p95}</strong></div><div class="stat"><span class="sub">503 件数（24 時間）</span><strong>${p.errors503}</strong></div><div class="stat"><span class="sub">要確認比率</span><strong>${p.reviewRatio}</strong></div></div>${table(['種別','検知件数（24 時間）'],p.counts.map(c=>[c[0],c[1]]))}<p class="sub">モデルバージョン ${esc(p.modelVersion)} · 規則 ${esc(p.ruleVersion)} · 取得：${p.reported}<br>取得元：検知サービスの /metrics（例） · 件数のみを表示し、検知した原文は含みません。異常時もクラウドへ切り替えません。</p></div>`,badge('ローカル検知サービス','blue'))}
function operations(){return head('監視とバッチ','監視元の状態と担当者の対応を分けて保持し、必要に応じて問題を特定します。')+context()+tabs([['alerts','アラートとイベント'],['tasks','タスク実行'],['logs','ログ検索']],'operationTab',operationTab)+(operationTab==='alerts'?panel('運用イベント',table(['イベント／監視元','元の状態','担当者の対応','担当者',''],state().alerts.map(a=>[`<b>${a.name}</b><div class="sub">${a.source}</div>`,status(a.origin),status(a.handling),a.owner,link('対応の詳細',`alertDetail('${a.id}')`)])))+`<p class="sub">担当者の確認や対応の完了は、CloudWatch などの監視元のアラート状態を変更しません。実際の復旧は監視元の後続の報告を正とします。</p>`+piiMetrics():operationTab==='tasks'?panel('タスク一覧',table(['タスク／実行基盤','実行 ID','最終実行','結果','状態',''],state().jobs.map(j=>[`<b>${j.name}</b><div class="sub">${j.source}</div>`,j.id,j.last,esc(j.detail),status(j.status),link('実行の詳細',`jobDetail('${j.id}')`)])))+`<p class="sub">再実行は承認済みのタスクに限ります。クリーニングタスクの再実行はこのデモでは開放していません。実行基盤が AWS のサービスかどうかは確認待ちです。</p>`:panel('固定テンプレートによるログ検索',`<div class="pad"><div class="formgrid"><div><label>検索する時間範囲</label><select id="window"><option>直近 15 分</option><option>直近 1 時間</option></select></div><div><label>リクエスト／関連 ID</label><input id="request" placeholder="req-demo-042"></div></div><p class="sub">承認済みロググループ：/application/chatbot（例） · 固定の障害特定テンプレート · マスク済みの結果のみ表示</p>${btn('ログを検索（模擬）','queryLogs()','primary')}<div id="logResult"></div></div>`,badge('CloudWatch Logs · 必要時に検索','blue')))}
function alertDetail(id){let a=state().alerts.find(x=>x.id===id);modal(a.name,table(['項目','現在の値'],[['監視元',a.source],['元の状態',a.origin],['担当者の対応',a.handling],['担当者',a.owner]])+`<p>${esc(a.detail)}</p><p class="sub">運用バックエンド側の対応記録のみを変更し、監視元の状態は保持します。</p>`,btn('閉じる','closeModal()')+btn('自分に割り当て',`handleAlert('${id}','確認済み')`,'','operate')+btn('対応を完了',`handleAlert('${id}','対応済み')`,'primary','operate'))}
function handleAlert(id,statusValue){let a=state().alerts.find(x=>x.id===id);review('イベント対応の更新',a.name,'担当者の対応：'+statusValue+'；元の状態は '+a.origin+' のまま','operate',()=>{a.handling=statusValue;a.owner=$('#role').selectedOptions[0].text})}
function jobDetail(id){let j=state().jobs.find(x=>x.id===id);modal(j.name,table(['項目','現在の値'],[['実行 ID',j.id],['実行基盤',j.source],['実行状態',j.status],['実行結果',esc(j.detail)],['元の実行との関連',j.parent||'なし']])+`<p class="sub">このデモは Celery beat の例を使います。AWS ネイティブの再実行と新規実行では ID の意味が異なるため、接続時に実際の実行基盤に合わせて対応付けます。</p>`,btn('閉じる','closeModal()')+(j.retryable?btn('タスクを再実行',`retryJob('${id}')`,'primary','operate'):badge('再実行には個別の承認が必要','warn')))}
function retryJob(id){let j=state().jobs.find(x=>x.id===id);review('タスクの再実行',j.name,'実行前に権限と依存関係を確認します。元の実行記録は残し、関連付けた新しい実行（模擬）を記録します。','operate',()=>{let k=state().knowledge[0];if(j.name.includes('同期')&&!k.resolved){log('タスクの再実行',j.name,'接続の認可が復旧していないため、実行を開始しませんでした','失敗');closeModal();render();toast('接続の認可が期限切れのままです。先にナレッジの詳細で認可の復旧（模擬）を行ってください');return false}state().jobs.unshift({...j,id:'job-'+Date.now().toString().slice(-7),parent:j.id,last:stamp(),status:'完了',detail:'模擬の実行が完了・元の記録は保持',retryable:false});if(j.name.includes('同期')){k.version=k.latest;k.status='利用可能';k.time=stamp();k.issue='';state().alerts[0].origin='復旧済み'};})}
function queryLogs(){let t=telemetry();if(!t.fresh){$('#logResult').innerHTML=`<div class="notice"><b>${t.state}のため、ログ検索を実行しませんでした。</b></div>`;return}let id=$('#request').value.trim()||'req-demo-042';$('#logResult').innerHTML=`<div class="query-result">${sourceLine('CloudWatch Logs Insights · 模擬の検索','時間範囲：'+$('#window').value)}${table(['関連 ID','サービス','結果','摘要'],[[esc(id),'モデル呼び出し','タイムアウト','上流の応答がタイムアウト・質問と回答の本文は表示しません'],[esc(id),'ボットの応答','失敗を記録','モデルの識別子とリリースバージョンを記録済み']])}<p class="sub">マスク済みの項目のみ表示します。AWS には接続しておらず、走査の費用も発生していません。</p></div>`;log('ログ検索',id,'固定テンプレート；'+$('#window').value+'；模擬の検索')}

function sources(){let items=customerView?[['effective','実効設定・テスト用スイッチ']]:[['connections','データソースと接続状況'],['effective','実効設定・テスト用スイッチ']];if(customerView)sourcesTab='effective';return head('システム接続','客先環境の境界内でネイティブの機能を集約し、取得元、権限、データの新しさを明確にします。')+context()+tabs(items,'sourcesTab',sourcesTab)+(sourcesTab==='connections'?`<div class="notice neutral"><div><b>デプロイの前提は例であり、確認済みのクラウド構成ではありません</b><div class="sub">客先の AWS 専用デプロイ · account ****0001（例） · Region は確認待ち · 既定ではアカウント外へ送信しません。</div></div></div>`+panel('データソースと機能',table(['業務機能','データの取得元','接続状態','取得時刻','境界'],sourceRows().map(r=>r.map(esc))))+`<div class="grid">${panel('模擬の接続状態',`<div class="pad"><p class="sub">画面の状態を議論するためのもので、実際の AWS 接続には客先の承認とバックエンドのアダプタが必要です。</p><div class="row"><span>コストと予算のサンプル</span>${btn(state().costConnected?'サンプルを外す':'サンプルを読み込む','toggleSource(\'cost\')','','operate')}</div><div class="row"><span>CloudTrail のサンプル</span>${btn(state().cloudtrailConnected?'サンプルを外す':'サンプルを読み込む','toggleSource(\'trail\')','','operate')}</div><div class="row"><span>監視データの取得状態</span><select aria-label="監視データの取得状態" onchange="telemetryScenario=this.value;render()">${[['normal','正常に取得'],['stale','データが古い'],['denied','読み取り権限なし']].map(r=>`<option value="${r[0]}" ${telemetryScenario===r[0]?'selected':''}>${r[1]}</option>`).join('')}</select></div></div>`)}${panel('権限と検索の制約',`<div class="pad"><div class="row"><span>呼び出し方式</span><b>バックエンドの AWS SDK アダプタ</b></div><div class="row"><span>資格情報</span><b>ワークロードのロール／一時的な資格情報</b></div><div class="row"><span>読み取りキャッシュ</span><b>指標は約 60 秒、費用は低頻度</b></div><div class="row"><span>アカウント横断</span><b>この版では有効にしない</b></div><p class="sub">正式な方式では、サービス、アカウント、Region、IAM、閉域網での到達性、ログの権限を確認します。</p></div>`)}</div>`+panel('クラウド運用の深い操作',`<div class="pad"><b>日常の要約は運用バックエンドで、リソースの深い操作は既存のクラウド運用の手順で行います</b><p class="sub">IAM の信頼ポリシー、ネットワーク、データベースの復旧、バックアップなどは権限を持つクラウド管理者が扱います。実接続後はアカウント／Region／リソースの文脈を付けた入口を提供できますが、現時点では確認していない客先コンソールへのリンクは生成しません。</p></div>`):`<div class="notice neutral"><div><b>ConfigMap の読み取り専用</b><div class="sub">環境変数と機能スイッチの現在値を表示します。値の変更は運用バックエンドからは行わず、本番デプロイ前の確認に使います。取得：2026-10-01 15:42 JST（例）。</div></div></div>`+panel('実効設定・テスト用スイッチ',table(['名称','本番の値','検証の値','期待','判定'],effectiveRows()),badge('ConfigMap · 参照のみ','blue'))+`<p class="sub">「要確認」は本番の値が期待と異なる項目です。テスト用スイッチ（devtools・夜間バッチの手動起動 API）は本番で無効であることを確認します。</p>`)}
function toggleSource(kind){let field=kind==='cost'?'costConnected':'cloudtrailConnected';review('デモ用データソースの切り替え',kind==='cost'?'AWS コストと予算':'CloudTrail','サンプルデータの読み込みまたは解除のみで、AWS の権限は付与も変更もしません。','operate',()=>state()[field]=!state()[field])}
function render(){let pages={overview,applications,releases,operations,usage,access,audit,sources};$('#nav').innerHTML=menus.map(m=>`<button class="nav ${page===m[0]?'active':''}" onclick="go('${m[0]}')"><span class="ic">${m[1]}</span>${m[2]}</button>`).join('');$('#app').innerHTML=pages[page]()+`<div class="footer">運用バックエンド · 設計案プロトタイプ · 模擬データ · ${env()} · この画面の内容はブラウザ内のみ保持（再読み込みで初期化）</div>`;document.title='GBase 運用バックエンド · '+menus.find(m=>m[0]===page)[2]}
$('#role').onchange=()=>{closeModal();render();toast('ロールを切り替えました。書き込み操作は権限に従って制限されます')};$('#env').onchange=()=>{closeModal();render();toast('独立した模擬の設定と運用操作記録を持つ環境に切り替えました')};if(customerView){let d=$('#deployment');d.value='private';d.outerHTML='<span>客先専用デプロイ・ワークスペース</span>';document.querySelector('.asidefoot').innerHTML='<span class="dot"></span>客先環境の境界内で集約<br>模擬の状態 · 15:42 JST'}else $('#deployment').onchange=()=>{closeModal();render();toast('デプロイ形態のプレビューを切り替えました。データの境界は変わらず、客先横断の集約も行いません')};
Object.values(states).forEach(s=>syncLoadAlerts(s));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&$('#overlay').firstChild){let nodes=[...$('#overlay').querySelectorAll('button,input,select,textarea,summary')].filter(n=>!n.disabled),first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});render();
