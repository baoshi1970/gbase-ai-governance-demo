function securityPanels(){let s=state().security,r=s.runtime,same=s.lockThreshold===r.lockThreshold&&s.lockMinutes===r.lockMinutes;return `<div class="grid"><div>${panel('登录失败锁定',`<div class="pad"><div class="formgrid"><div><label>连续失败次数（1～10）</label><input id="lockThreshold" type="number" min="1" max="10" value="${s.lockThreshold}" ${has('grant')?'':'disabled'}></div><div><label>锁定时长（分钟，1～1440）</label><input id="lockMinutes" type="number" min="1" max="1440" value="${s.lockMinutes}" ${has('grant')?'':'disabled'}></div></div><p class="sub">对 TCI 回复（9/30）：5 次 / 15 分。变更需理由并写入操作审计。</p>${btn('审阅并保存','saveLock()','primary','grant')}</div>`,badge('规约② 7.2','blue'))}${panel('锁定账号',table(['账号','锁定时刻','失败次数',''],s.locked.map(u=>[esc(u.user),u.since,u.count,btn('解除锁定',`unlockUser('${u.user}')`,'','operate')])),badge(s.locked.length+' 件','warn'))}</div><div>${panel('生效确认',`<div class="pad"><div class="row"><span>后台设定</span><b>${s.lockThreshold} 次 / ${s.lockMinutes} 分</b></div><div class="row"><span>运行时上报</span><b>${r.lockThreshold} 次 / ${r.lockMinutes} 分</b></div><div class="row"><span>核对结果</span>${badge(same?'一致':'不一致（待反映）',same?'good':'warn')}</div><p class="sub">上报时刻：${r.reported}<br>设定保存后不代表已生效；以运行时上报为准（#562 教训）。</p>${!same?btn('模拟运行时反映','applyLock()','','operate'):''}</div>`)}${panel('其他安全设定（只读）',`<div class="pad"><div class="row"><span>密码策略</span><span class="sub">${esc(s.passwordPolicy)}</span></div><div class="row"><span>会话有效期</span><b>${s.sessionMinutes} 分</b></div><div class="row"><span>MFA</span><span class="sub">${esc(s.mfa)}</span></div><p class="sub">规约② 7・9 说明用；本期不在后台修改。</p></div>`)}</div></div>`}
